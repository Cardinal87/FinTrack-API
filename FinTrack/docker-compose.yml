version: "3.9"
services:
  fintrack.api:
    #image: cardinal87/fintrack:latest
    build:
      context: .
      dockerfile: Fintrack.Api/Dockerfile
    ports:
    - 8080:8080
    volumes:
    - fintrack-logs:/app/logs
    - vault-creds:/shared
    environment:
    - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_USERNAME=${POSTGRES_USER}
    - POSTGRES_HOST=${POSTGRES_HOST}
    - POSTGRES_PORT=${POSTGRES_PORT}
    - Serilog__WriteTo__2__Args__uri=${LOKI_URI}
    - HashicorpVaultOptions__VaultAddress=${VAULT_URI}
    - ROLEID_PATH=/shared/roleid
    
    depends_on:
      db:
        condition: service_started  
      loki:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    networks:
      api-network:
         ipv4_address: 10.0.0.30
      telemetry-network:

  db:
   image: postgres:18.4
   volumes:
   - postgres-data:/var/lib/postgresql
   environment:
   - POSTGRES_USER=${POSTGRES_USER}
   - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
   - POSTGRES_DB=FinTrackDb
   networks:
   - api-network

  
  vault:
    image: hashicorp/vault:2.0.3
    ports: 
    - 8200:8200
    volumes: 
    - vault-data:/vault/file
    - ../configs/vault.hcl:/vault/config/config.hcl
    entrypoint: ["vault", "server", "-config=/vault/config/config.hcl"]
    networks:
    - api-network
  


  vault-init:
    image: cardinal87/autovault:1.0.0  
    volumes:
    - vault-creds:/shared
    depends_on:
      - vault
    environment:
      - VAULT_ADDR=http://vault:8200
    networks:
      - api-network


  loki:
    image: grafana/loki:3.7.0
    volumes:
    - loki-data:/loki
    - ../configs/loki.yaml:/etc/loki/local-config.yaml
    networks:
    - telemetry-network
    - grafana-network


  grafana:
    image: grafana/grafana:13.1.0
    ports:
    - 3000:3000
    volumes:
    - grafana-data:/var/lib/grafana
    environment:
    - GF_SECURITY_ADMIN_USER=${GRAFANA_USERNAME}
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    networks:
    - grafana-network

  prometheus:
    image: prom/prometheus:v3.12.0
    ports:
    - 9090:9090
    volumes:
    - prometheus-data:/prometheus
    - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
    - telemetry-network
    - grafana-network

volumes:
  fintrack-logs:
  postgres-data:
  loki-data:
  grafana-data:
  prometheus-data:
  vault-data:
  vault-creds:

networks:
  api-network:
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.0.0/24
  grafana-network:
    driver: bridge
  telemetry-network:
    driver: bridge
    internal: true
 